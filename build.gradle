plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "agonia_fishing_qol" {
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def generatedWaterResources = layout.buildDirectory.dir("generated/water-resources")
def waterTextureSource = layout.projectDirectory.file(
    "src/client/resources/agonia_fishing_qol/water_surface.png.b64"
)

def generateWaterTextures = tasks.register("generateWaterTextures") {
    inputs.file waterTextureSource
    outputs.dir generatedWaterResources

    doLast {
        byte[] textureBytes = java.util.Base64.decoder.decode(waterTextureSource.asFile.text.trim())
        File textureDirectory = generatedWaterResources.get()
            .dir("assets/minecraft/textures/block")
            .asFile
        textureDirectory.mkdirs()
        new File(textureDirectory, "water_still.png").bytes = textureBytes
        new File(textureDirectory, "water_flow.png").bytes = textureBytes
    }
}

sourceSets.client.resources.srcDir generatedWaterResources

tasks.named("processClientResources") {
    dependsOn generateWaterTextures
    exclude "agonia_fishing_qol/water_surface.png.b64"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn generateWaterTextures
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
